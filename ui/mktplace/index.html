<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace UI</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
<div id="root"></div>

<script type="text/babel" presets="react">
    const { useState, useEffect } = React;

    function App() {
        const [token, setToken] = useState(localStorage.getItem('token'));
        const [role, setRole] = useState(localStorage.getItem('role'));
        const [username, setUsername] = useState('');
        const [password, setPassword] = useState('pass');

        const [products, setProducts] = useState([]);
        const [totalElements, setTotalElements] = useState(0);
        const [error, setError] = useState('');
        const [success, setSuccess] = useState('');

        const [newProduct, setNewProduct] = useState({
            name: '', description: '', price: 100, stock: 10,
            category: 'Electronics', status: 'ACTIVE'
        });

        const [editingProduct, setEditingProduct] = useState(null);

        // Состояние для просмотра одного товара (GET by ID)
        const [viewingProduct, setViewingProduct] = useState(null);

        const [filterStatus, setFilterStatus] = useState('');
        const [filterCategory, setFilterCategory] = useState('');
        const [page, setPage] = useState(0);
        const [size, setSize] = useState(5);

        const canEdit = role === 'SELLER' || role === 'ADMIN';

        useEffect(() => {
            if (token) fetchProducts(0, size, '', '');
        }, [token]);

        const handleLogin = async (e) => {
            e.preventDefault();
            setError(''); setSuccess('');
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                if (!res.ok) throw new Error('Неверный логин или пароль');
                const data = await res.json();
                const payload = JSON.parse(atob(data.accessToken.split('.')[1]));
                setToken(data.accessToken);
                setRole(payload.role);
                localStorage.setItem('token', data.accessToken);
                localStorage.setItem('role', payload.role);
                setSuccess('Успешный вход!');
            } catch (err) {
                setError(err.message);
            }
        };

        const handleLogout = () => {
            setToken(null); setRole(null); setProducts([]);
            localStorage.removeItem('token'); localStorage.removeItem('role');
        };

        const fetchProducts = async (p = page, s = size, statusFilter = filterStatus, catFilter = filterCategory) => {
            try {
                const params = new URLSearchParams();
                params.append('page', p);
                params.append('size', s);
                if (statusFilter) params.append('status', statusFilter);
                if (catFilter) params.append('category', catFilter);

                const url = `/api/products?${params.toString()}`;
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) {
                    const data = await res.json();
                    setProducts(data.content);
                    setTotalElements(data.totalElements);
                    setPage(data.page);
                    setSize(data.size);
                }
            } catch (err) { console.error(err); }
        };

        // --- GET BY ID ---
        const handleViewDetails = async (id) => {
            setError('');
            try {
                const res = await fetch(`/api/products/${id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    setViewingProduct(data); // Открываем модалку
                } else {
                    throw new Error('Не удалось загрузить товар');
                }
            } catch (err) {
                setError(err.message);
            }
        };

        const handleApplyFilters = (e) => {
            e.preventDefault();
            fetchProducts(0, size, filterStatus, filterCategory);
        };

        const handleResetFilters = () => {
            setFilterStatus(''); setFilterCategory('');
            fetchProducts(0, size, '', '');
        };

        const handleGenerateTestData = async () => {
            setError(''); setSuccess('Генерация...');
            const categories = ['Electronics', 'Books', 'Clothes', 'Food'];
            for (let i = 0; i < 25; i++) {
                const cat = categories[Math.floor(Math.random() * categories.length)];
                await fetch('/api/products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({
                        name: `Тестовый товар ${i + 1}`,
                        description: `Описание для товара ${i + 1}`,
                        price: Math.floor(Math.random() * 1000) + 10,
                        stock: Math.floor(Math.random() * 50) + 1,
                        category: cat,
                        status: 'ACTIVE'
                    })
                });
            }
            setSuccess('25 товаров успешно созданы!');
            fetchProducts(0, size, '', '');
        };

        const handleSubmit = async (e) => {
            e.preventDefault();
            setError(''); setSuccess('');

            const isEditing = editingProduct !== null;
            const url = isEditing ? `/api/products/${editingProduct.id}` : '/api/products';
            const method = isEditing ? 'PUT' : 'POST';
            const bodyData = isEditing ? editingProduct : newProduct;

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(bodyData)
                });

                if (res.status === 403) throw new Error('403 Forbidden: У вас нет прав на это действие');
                if (res.status === 400) throw new Error('400 Bad Request: Ошибка валидации');
                if (!res.ok) throw new Error(isEditing ? 'Ошибка обновления' : 'Ошибка создания');

                setSuccess(isEditing ? 'Товар успешно обновлен!' : 'Товар успешно создан!');

                if (isEditing) {
                    setEditingProduct(null);
                } else {
                    setNewProduct({ name: '', description: '', price: 100, stock: 10, category: 'Electronics', status: 'ACTIVE' });
                }

                fetchProducts(isEditing ? page : 0, size, isEditing ? filterStatus : '', isEditing ? filterCategory : '');
            } catch (err) {
                setError(err.message);
            }
        };

        const handleDelete = async (id) => {
            setError(''); setSuccess('');
            try {
                const res = await fetch(`/api/products/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.status === 403) throw new Error('403 Forbidden: У вас нет прав');
                if (!res.ok) throw new Error('Ошибка удаления');

                setSuccess('Товар архивирован (Soft Delete)');
                fetchProducts(page, size);
            } catch (err) {
                setError(err.message);
            }
        };

        if (!token) {
            return (
                <div className="flex h-screen items-center justify-center">
                    <form onSubmit={handleLogin} className="bg-white p-8 rounded shadow-md w-96">
                        <h2 className="text-2xl font-bold mb-4">Вход в Marketplace</h2>
                        {error && <div className="bg-red-100 text-red-700 p-2 mb-4 rounded">{error}</div>}
                        <label className="block text-sm font-medium text-gray-700 mb-1">Логин</label>
                        <input type="text" placeholder="user, seller, admin" value={username} onChange={e => setUsername(e.target.value)} className="w-full border p-2 mb-3 rounded" required/>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
                        <input type="password" placeholder="pass" value={password} onChange={e => setPassword(e.target.value)} className="w-full border p-2 mb-4 rounded" required/>
                        <button className="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Войти</button>
                    </form>
                </div>
            );
        }

        return (
            <div className="max-w-5xl mx-auto p-4">
                    <header className="flex justify-between items-center bg-white p-4 rounded shadow mb-6">
                        <div>
                            <h1 className="text-xl font-bold">Marketplace UI</h1>
                            <span className="text-sm text-gray-500">Вы вошли как: <b>{role}</b></span>
                        </div>
                        <div className="flex gap-3">
                            <button onClick={handleLogout} className="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Выйти</button>
                        </div>
                    </header>

                {error && <div className="bg-red-100 text-red-700 p-3 mb-4 rounded shadow">{error}</div>}
                {success && <div className="bg-green-100 text-green-700 p-3 mb-4 rounded shadow">{success}</div>}

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    {/* ФОРМА */}
                    <div className={`bg-white p-6 rounded shadow ${editingProduct ? 'border-2 border-yellow-400' : ''}`}>
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-lg font-bold">
                                {editingProduct ? `Редактировать: ${editingProduct.name}` : 'Создать товар'}
                            </h2>
                            {editingProduct && (
                                <button onClick={() => setEditingProduct(null)} className="bg-gray-200 text-gray-700 px-3 py-1 rounded hover:bg-gray-300 text-sm">Отмена</button>
                            )}
                        </div>

                        <form onSubmit={handleSubmit} className="flex flex-col gap-3">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Название</label>
                                <input type="text" value={editingProduct ? editingProduct.name : newProduct.name}
                                       onChange={e => editingProduct ? setEditingProduct({...editingProduct, name: e.target.value}) : setNewProduct({...newProduct, name: e.target.value})}
                                       className="border p-2 rounded w-full" required/>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Описание</label>
                                <textarea value={editingProduct ? (editingProduct.description || '') : newProduct.description}
                                          onChange={e => editingProduct ? setEditingProduct({...editingProduct, description: e.target.value}) : setNewProduct({...newProduct, description: e.target.value})}
                                          className="border p-2 rounded w-full" rows="2"/>
                            </div>
                            <div className="flex gap-2">
                                <div className="w-1/2">
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Цена</label>
                                    <input type="number" value={editingProduct ? editingProduct.price : newProduct.price}
                                           onChange={e => editingProduct ? setEditingProduct({...editingProduct, price: Number(e.target.value)}) : setNewProduct({...newProduct, price: Number(e.target.value)})}
                                           className="border p-2 rounded w-full" required/>
                                </div>
                                <div className="w-1/2">
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Остаток</label>
                                    <input type="number" value={editingProduct ? editingProduct.stock : newProduct.stock}
                                           onChange={e => editingProduct ? setEditingProduct({...editingProduct, stock: Number(e.target.value)}) : setNewProduct({...newProduct, stock: Number(e.target.value)})}
                                           className="border p-2 rounded w-full" required/>
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Категория</label>
                                <input type="text" value={editingProduct ? editingProduct.category : newProduct.category}
                                       onChange={e => editingProduct ? setEditingProduct({...editingProduct, category: e.target.value}) : setNewProduct({...newProduct, category: e.target.value})}
                                       className="border p-2 rounded w-full" required/>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Статус</label>
                                <select value={editingProduct ? editingProduct.status : newProduct.status}
                                        onChange={e => editingProduct ? setEditingProduct({...editingProduct, status: e.target.value}) : setNewProduct({...newProduct, status: e.target.value})}
                                        className="border p-2 rounded w-full">
                                    <option value="ACTIVE">ACTIVE</option>
                                    <option value="INACTIVE">INACTIVE</option>
                                </select>
                            </div>
                            <button className={`text-white px-4 py-2 rounded mt-2 ${editingProduct ? 'bg-yellow-500 hover:bg-yellow-600' : 'bg-green-600 hover:bg-green-700'}`}>
                                {editingProduct ? 'Сохранить изменения' : 'Создать'}
                            </button>
                        </form>

                        {!editingProduct && canEdit && (
                            <button onClick={handleGenerateTestData} className="w-full bg-indigo-100 text-indigo-700 px-4 py-2 rounded hover:bg-indigo-200 mt-3 text-sm">
                                Сгенерировать 25 тестовых товаров
                            </button>
                        )}
                    </div>

                    {/* Панель фильтрации */}
                    <div className="bg-white p-6 rounded shadow h-fit">
                        <h2 className="text-lg font-bold mb-4">Фильтрация</h2>
                        <form onSubmit={handleApplyFilters} className="flex flex-col gap-3">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Статус</label>
                                <select value={filterStatus} onChange={e => setFilterStatus(e.target.value)} className="border p-2 rounded w-full">
                                    <option value="">Все статусы</option>
                                    <option value="ACTIVE">ACTIVE</option>
                                    <option value="INACTIVE">INACTIVE</option>
                                    <option value="ARCHIVED">ARCHIVED</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Категория</label>
                                <input type="text" placeholder="Например, Electronics" value={filterCategory} onChange={e => setFilterCategory(e.target.value)} className="border p-2 rounded w-full"/>
                            </div>
                            <div className="flex gap-2 mt-2">
                                <button type="submit" className="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 w-1/2">Применить</button>
                                <button type="button" onClick={handleResetFilters} className="bg-gray-300 text-gray-800 px-4 py-2 rounded hover:bg-gray-400 w-1/2">Сбросить</button>
                            </div>
                        </form>
                    </div>
                </div>

                {/* Список товаров */}
                <div className="bg-white p-6 rounded shadow">
                    <div className="flex justify-between items-center mb-4">
                        <h2 className="text-lg font-bold">Товары (Всего: {totalElements})</h2>
                        <div className="flex gap-2 items-center">
                            <label className="text-sm text-gray-600">На странице:</label>
                            <select value={size} onChange={(e) => {
                                const newSize = Number(e.target.value);
                                setSize(newSize);
                                fetchProducts(0, newSize, filterStatus, filterCategory);
                            }} className="border p-1 rounded text-sm">
                                <option value="5">5</option>
                                <option value="10">10</option>
                                <option value="20">20</option>
                            </select>
                        </div>
                    </div>

                    <div className="grid gap-4 mb-4">
                        {products.map(p => (
                            <div key={p.id} className="border p-4 rounded flex justify-between items-center bg-gray-50">
                                <div>
                                    <h3 className="font-bold">{p.name}</h3>
                                    <p className="text-sm text-gray-600 mb-1">{p.description || 'Нет описания'}</p>
                                    <p className="text-sm text-gray-600">{p.category} | Цена: {p.price} | Остаток: {p.stock}</p>
                                    <p className="text-xs text-gray-400">ID: {p.id} | Статус: <span className={p.status === 'ACTIVE' ? 'text-green-600 font-bold' : 'text-red-600 font-bold'}>{p.status}</span></p>
                                </div>
                                <div className="flex flex-col gap-2">
                                    {/* Кнопка Подробнее для GET /products/{id} */}
                                    <button onClick={() => handleViewDetails(p.id)} className="bg-blue-100 text-blue-700 px-3 py-1 rounded hover:bg-blue-200 text-sm">Подробнее</button>

                                    {canEdit && (
                                        <>
                                            <button onClick={() => setEditingProduct(p)} className="bg-yellow-100 text-yellow-700 px-3 py-1 rounded hover:bg-yellow-200 text-sm">Изменить</button>
                                            <button onClick={() => handleDelete(p.id)} className="bg-red-100 text-red-700 px-3 py-1 rounded hover:bg-red-200 text-sm">Удалить</button>
                                        </>
                                    )}
                                </div>
                            </div>
                        ))}
                        {products.length === 0 && <p className="text-gray-500">Товаров нет</p>}
                    </div>

                    <div className="flex justify-between items-center mt-4">
                        <button disabled={page === 0} onClick={() => fetchProducts(page - 1, size)} className="bg-gray-200 px-4 py-2 rounded disabled:opacity-50">← Назад</button>
                        <span className="text-sm text-gray-600">Страница: {page + 1}</span>
                        <button disabled={(page + 1) * size >= totalElements} onClick={() => fetchProducts(page + 1, size)} className="bg-gray-200 px-4 py-2 rounded disabled:opacity-50">Вперед →</button>
                    </div>
                </div>

                {/* МОДАЛЬНОЕ ОКНО ДЛЯ ПРОСМОТРА (GET BY ID) */}
                {viewingProduct && (
                    <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                        <div className="bg-white p-6 rounded shadow-lg w-96 max-w-full">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-lg font-bold text-blue-600">Детали товара</h2>
                                <button onClick={() => setViewingProduct(null)} className="text-gray-500 hover:text-black font-bold text-xl">&times;</button>
                            </div>
                            <div className="space-y-2 text-sm">
                                <p><span className="font-semibold">ID:</span> {viewingProduct.id}</p>
                                <p><span className="font-semibold">Название:</span> {viewingProduct.name}</p>
                                <p><span className="font-semibold">Описание:</span> {viewingProduct.description || '-'}</p>
                                <p><span className="font-semibold">Цена:</span> {viewingProduct.price}</p>
                                <p><span className="font-semibold">Остаток:</span> {viewingProduct.stock}</p>
                                <p><span className="font-semibold">Категория:</span> {viewingProduct.category}</p>
                                <p><span className="font-semibold">Статус:</span> {viewingProduct.status}</p>
                                <p><span className="font-semibold">Создан:</span> {new Date(viewingProduct.created_at).toLocaleString()}</p>
                                <p><span className="font-semibold">Обновлен:</span> {new Date(viewingProduct.updated_at).toLocaleString()}</p>
                            </div>
                            <button onClick={() => setViewingProduct(null)} className="mt-6 w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Закрыть</button>
                        </div>
                    </div>
                )}
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
