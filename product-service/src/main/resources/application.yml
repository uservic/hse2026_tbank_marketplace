server:
  port: ${SERVER_PORT:8082}
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: product-service
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET:my-super-secret-key-for-marketplace-12345}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/products_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Проверяем, что структура строго соответствует Flyway миграциям
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: public

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health

# струткурное логирование (Elastic Common Schema)
logging:
  structured:
    format:
      console: ecs

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    config-url: /api/products/v3/api-docs/swagger-config
    url: /api/products/v3/api-docs
