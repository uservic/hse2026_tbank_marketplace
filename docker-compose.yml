services:
  marketplace-db:
    # --- МИКРОСЕРВИС БД product  ---
    image: postgres:15-alpine
    container_name: marketplace-postgres
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - marketplace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d products_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- МИКРОСЕРВИС АВТОРИЗАЦИИ ---
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: auth-service
    container_name: auth-service-app
    ports:
      - "8081:8081"
    environment:
      JWT_SECRET: "my-super-secret-key-for-marketplace-12345"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # --- МИКРОСЕРВИС ТОВАРОВ ---
  product-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: product-service
    container_name: product-service-app
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://marketplace-db:5432/products_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      JWT_SECRET: "my-super-secret-key-for-marketplace-12345"
    depends_on:
      marketplace-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

  # --- API Gateway ---
  nginx-gateway:
    image: nginx:alpine
    container_name: marketplace-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ui:/usr/share/nginx/html:ro
    depends_on:
      - auth-service
      - product-service

volumes:
  marketplace_pgdata:
