events {
    worker_connections 1024;
}

http {
    # Логирование в JSON (полезно для отладки)
    log_format json_combined escape=json
    '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_request_id":"$http_x_request_id"'
    '}';
    access_log /var/log/nginx/access.log json_combined;

    upstream auth_service {
        server auth-service:8081;
    }

    upstream product_service {
        server product-service:8082;
    }

    server {
        listen 80;
        server_name localhost;

        set $req_id $http_x_request_id;
        if ($req_id = "") {
            set $req_id $request_id;
        }
        add_header X-Request-Id $req_id always;

        # --- РАЗДАЧА UI ---
        location /mktplace/ {
            alias /usr/share/nginx/html/mktplace/;
            index index.html;
            try_files $uri $uri/ /mktplace/index.html; # Чтобы SPA работало
        }

        # Опционально: редирект с /mktplace на /mktplace/, чтобы не было 404
        location = /mktplace {
            return 301 /mktplace/;
        }

        # Auth Service
        location /api/auth {
            # Убираем префикс /api
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://auth_service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Product Service
        location /api/products {
            # Убираем префикс /api перед передачей в сервис
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://product_service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Пробрасываем X-Request-Id, если он пришел от клиента
            proxy_set_header X-Request-Id $http_x_request_id;
        }

        # Статика
        # location / {
        #     root /usr/share/nginx/html;
        #     index index.html;
        # }
    }
}